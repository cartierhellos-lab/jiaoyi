<div id="main-content">
	<div id="top-alert" class="fixed alert alert-error" style="display: none;">
		<button class="close fixed" style="margin-top: 4px;">&times;</button>
		<div class="alert-content">警告内容</div>
	</div>
	<div id="main" class="main">
		<div class="main-title-h">
			<span class="h1-title">会员充值列表</span>
			<a class="btn btn-warning" onClick="location.href='{:U('Agent/Index/czlist')}'">初始化搜索</a>
		</div>
		<div class="cf">
			<div class="search-form fr cf" style="43px;float: none !important;">
				<div class="sleft">
					<form name="formSearch" id="formSearch" method="get" name="form1">
						<input type="text" name="username" class="search-input form-control" value="" placeholder="请输入邮箱账号" />
						<a class="sch-btn" href="javascript:;" id="search"> <i class="btn-search"></i> </a>
					</form>
					<script>
						//搜索功能
						$(function () {
							$('#search').click(function () {
								$('#formSearch').submit();
							});
						});
						//回车搜索
						$(".search-input").keyup(function (e) {
							if (e.keyCode === 13) {
								$("#search").click();
								return false;
							}
						});
					</script>
				</div>
			</div>
		</div>
		<div class="data-table table-striped">
			<table class="">
				<thead>
				<tr>
					<th class="">会员ID</th>
					<th class="">会员账号</th>
					<th class="">充值币种</th>
					<th class="">充值时间</th>
					<th class="">处理时间</th>
					<th class="">充值数量</th>
					<th class="">实际到账</th>
					<th class="">转账凭证</th>
					<th class="">状态</th>
				</tr>
				</thead>
				<tbody>
                    <notempty name="list">
                    <volist name="list" id="vo">
					<tr>
						<td>{$vo.id}</td>
						<td>{$vo.username}</td>
						<td><?php echo strtoupper($vo['coin']);?></td>
						<td>{$vo.addtime}</td>
						<td>{$vo.updatetime}</td>
						<td>{$vo['num']*1}</td>
						<td>{$vo['num']*1}</td>
						<td><img src="/Public/Static/payimgs/{$vo.payimg}" style="height:60px;"/></td>
						<td>
							<eq name="vo.status" value="1">
							    <span style="color:blue;">等待审核</span>
							</eq>
							<eq name="vo.status" value="2">
							    <span style="color:green;">审核通过</span>
							</eq>
							<eq name="vo.status" value="3">
							    <span style="color:red;">驳回充值</span>
							</eq>
						</td>
					</tr>
					</volist>
                    <else/>
					<td colspan="12" class="text-center empty-info">
					    <i class="glyphicon glyphicon-exclamation-sign"></i>暂无数据
					</td>
					</notempty>
				</tbody>
			</table>
			<div class="page">
				<div>{$page}</div>
			</div>
		</div>
	</div>
</div>
